<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dégradé linéaire violet / violet clair -->
    <linearGradient id="purpleGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B1EB7" />
      <stop offset="50%" stop-color="#8A3FE1" />
      <stop offset="100%" stop-color="#C25BF6" />
    </linearGradient>

    <!-- Ombre portée douce pour la flèche -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fond noir (optionnel) -->
  <rect width="500" height="500" fill="#0A0A0A" />

  <!-- Anneau extérieur -->
  <path 
    fill="url(#purpleGradient)" 
    fill-rule="evenodd" 
    d="M 250,30 
       A 220,220 0 1,1 249.9,30 Z 
       M 250,90 
       A 160,160 0 1,0 250.1,90 Z" 
  />

  <!-- Flèche montante avec coins arrondis -->
  <path 
    fill="url(#purpleGradient)" 
    filter="url(#dropShadow)"
    stroke="url(#purpleGradient)"
    stroke-width="12"
    stroke-linejoin="round"
    stroke-linecap="round"
    d="M 105,315 
       L 175,245 
       L 225,290 
       L 330,185 
       L 280,175 
       L 375,150 
       L 350,245 
       L 338,198 
       L 225,310 
       L 175,265 
       Z" 
  />
</svg>
